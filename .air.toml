# Config file for Air (https://github.com/cosmtrek/air) in TOML format

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main.exe ./core/main.go"
  bin = "./tmp/main.exe"
  full_bin = "./tmp/main.exe"
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "proto"]
  exclude_dir = [
    "assets", "tmp", "vendor", "tests", "docs",
    "extension-example", "plugins",
    ".git",
    # include_dir 里的 "core" 会把 core/frontend 整个带进来，其中
    # node_modules 有 701 个子目录 —— 实测占全部被监视目录的 97%，而它们
    # 与这里的 Go 构建毫无关系（include_ext 只认 go/yaml/proto 等）。
    # 前端有自己的 npm run dev。
    "core/frontend/node_modules", "core/frontend/dist",
  ]
  include_dir = ["core", "proto"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  log = "air.log"
  poll = false
  poll_interval = 0
  delay = 1000 
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
