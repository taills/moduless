version: "2"
sql:
  - schema: "../core/db/migrations"
    queries: "query.sql"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc"
        out: "../core/db/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
