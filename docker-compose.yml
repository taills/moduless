# Core + PostgreSQL.
#
# There are no separate services for plugins: Core starts them as subprocesses
# from PLUGIN_DIR, so scaling and restarting them is Core's job rather than the
# orchestrator's.
#
#   # build the example plugin into the mounted directory
#   mkdir -p plugins/notes/bin
#   CGO_ENABLED=0 GOOS=linux go build -o plugins/notes/bin/plugin ./extension-example/plugin
#   cp extension-example/plugin/manifest.yaml plugins/notes/
#
#   docker compose up --build
#   # log in at http://localhost:8080 (admin / admin123)
#   # the plugin is picked up at startup; use 插件管理 to enable, disable or reload it
#
# Core is deliberately single-instance: resilience comes from the supervisor
# restarting it and from plugins being restarted by Core, not from running
# several copies. The in-process cache, locks and session store all assume this.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: moduless
      POSTGRES_PASSWORD: moduless
      POSTGRES_DB: moduless
    volumes:
      # PostgreSQL 18 wants the volume at /var/lib/postgresql, not at its data
      # subdirectory — mounting the old path makes the image refuse to start,
      # because it cannot then run pg_upgrade --link across the mount boundary.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moduless"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    environment:
      HTTP_ADDR: ":80"
      DATABASE_URL: "postgres://moduless:moduless@postgres:5432/moduless?sslmode=disable"
      PLUGIN_DIR: "/app/plugins"
      PLUGIN_DATA_DIR: "/app/plugin-data"
      PLUGIN_LOG_LEVEL: "info"
      # Object storage is optional; without it the file capability reports
      # Unavailable and everything else still works.
      # RUSTFS_ENDPOINT: "http://rustfs:9000"
      # RUSTFS_BUCKET: "moduless"
      # RUSTFS_ACCESS_KEY: ""
      # RUSTFS_SECRET_KEY: ""
    ports:
      - "8080:80"
    volumes:
      # Plugin packages, mounted so they can be updated without rebuilding the
      # image. Each package is a directory: manifest.yaml, bin/plugin, and an
      # optional frontend/.
      - ./plugins:/app/plugins
      - plugindata:/app/plugin-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  plugindata:
