key: go_example
display_name: "Go 示例扩展"
version: "1.0.0"
menu:
  icon: "go"
  path: "/go-example"
frontend:
  entry: "/extensions/go_example/index.html"
database:
  collections:
    - name: "items"
      indexes:
        - fields: ["status"]
        - fields: ["code"]
          unique: true
ui_slots:
  - slot_name: "dashboard.widget"
    component_entry: "/extensions/go_example/widget.js"
audit:
  paths:
    - method: "POST"
      path: "/items/*"
