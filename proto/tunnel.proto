syntax = "proto3";

package tunnel;

option go_package = "github.com/ty-lab/go-web-module/proto/tunnel";

option java_multiple_files = true;
option java_package = "com.ty.sdk.proto";
option java_outer_classname = "TunnelProto";

// ExtensionTunnel maintains the reverse bidirectional HTTP-over-gRPC tunnel.
service ExtensionTunnel {
  rpc Connect(stream TunnelMessage) returns (stream TunnelMessage);
}

// DatabaseService is the Core-Managed Document Store (CMDS) proxy.
service DatabaseService {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Find(FindRequest) returns (FindResponse);
}

// EventBusService is the distributed event bus over gRPC.
service EventBusService {
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc Subscribe(stream SubscribeRequest) returns (stream EventMessage);
}

// FileService exposes file token generation / metadata to extensions.
service FileService {
  rpc GenerateDownloadToken(TokenRequest) returns (TokenResponse);
  rpc GetMetadata(FileMetaRequest) returns (FileMetaResponse);
}

message TunnelMessage {
  string message_id = 1;
  oneof payload {
    RegisterRequest register_req = 2;
    FileChunk file_chunk = 3;
    RegisterComplete register_complete = 4;
    RegisterResponse register_resp = 5;
    HttpRequestChunk http_req_chunk = 6;
    HttpResponseChunk http_resp_chunk = 7;
    Ping ping = 8;
    Pong pong = 9;
  }
}

// ================== DB transport ==================
message PutRequest {
  string collection = 1;
  string document_id = 2;
  bytes json_data = 3;
}
message PutResponse { bool success = 1; }

message GetRequest {
  string collection = 1;
  string document_id = 2;
}
message GetResponse {
  bool found = 1;
  bytes json_data = 2;
}

message DeleteRequest {
  string collection = 1;
  string document_id = 2;
}
message DeleteResponse { bool success = 1; }

message FindRequest {
  string collection = 1;
  repeated QueryFilter filters = 2;
  int32 limit = 3;
  int32 offset = 4;
}
message QueryFilter {
  string field = 1;
  string operator = 2; // "=", ">", "<", "LIKE"
  string value = 3;
}
message FindResponse {
  repeated bytes documents = 1;
}

// ================== Event bus transport ==================
message PublishRequest {
  string event_name = 1;
  bytes event_data = 2;
}
message PublishResponse { bool success = 1; }

message SubscribeRequest {
  string event_name = 1;
}
message EventMessage {
  string event_name = 1;
  bytes event_data = 2;
}

// ================== File service transport ==================
message TokenRequest {
  string file_id = 1;
  string user_id = 2;
  int32 expiry_seconds = 3;
}
message TokenResponse {
  string token = 1;
  string url = 2;
}
message FileMetaRequest {
  string file_id = 1;
}
message FileMetaResponse {
  bool found = 1;
  string file_id = 2;
  string filename = 3;
  int64 size = 4;
  string mime_type = 5;
}

// ================== Register & HTTP tunnel ==================
message RegisterRequest {
  string extension_key = 1;
  string version = 2;
  string display_name = 3;
  string menu_icon = 4;
  string menu_path = 5;
  uint64 zip_file_size = 6;
  string zip_sha256 = 7;
  bool is_dev = 8;
  string dev_frontend_url = 9;
}

message FileChunk {
  bytes content = 1;
  uint32 chunk_index = 2;
}

message RegisterComplete {}

message RegisterResponse {
  bool success = 1;
  string error_message = 2;
  bool skip_upload = 3;
}

message HttpRequestChunk {
  string stream_id = 1;
  bool is_first = 2;
  bool is_last = 3;
  string method = 4;
  string path = 5;
  string query = 6;
  map<string, string> headers = 7;
  bytes body_chunk = 8;
}

message HttpResponseChunk {
  string stream_id = 1;
  bool is_first = 2;
  bool is_last = 3;
  int32 status_code = 4;
  map<string, string> headers = 5;
  bytes body_chunk = 6;
}

message Ping { int64 timestamp = 1; }
message Pong { int64 timestamp = 1; }
